name: nightly-scrape

# Each night, aiming for 02:00 to 05:00 Hong Kong time (see the cron line): apply pending migrations, then scrape
# every approved operator. A job killed by its timeout has saved nothing (saving is one
# transaction at the end), so last night's data stays. A failed job makes GitHub email the owner.
on:
  schedule:
    - cron: '17 12 * * *'   # 12:17 UTC, six hours early on purpose: GitHub has started this job about six hours late every night, and the aim is 02:00-05:00 Hong Kong (off the hour: GitHub delays or drops jobs scheduled on it)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-scrape
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs the pnpm version named in package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional: verifies the database server. An unset secret is an empty string, which means "not supplied".
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}

      # Reports only whether the two settings exist (never their values) and cannot fail the job. The scraper
      # takes the site's address and contact (its User-Agent) from them, and refuses to run without them.
      - name: Site identity settings present?
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          echo "SITE_URL set: $([ -n "$SITE_URL" ] && echo yes || echo no)"
          echo "CONTACT_EMAIL set: $([ -n "$CONTACT_EMAIL" ] && echo yes || echo no)"

  scrape:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 170 # must be finished by 05:00 Hong Kong
    strategy:
      fail-fast: false # one operator failing must not stop the others
      matrix:
        # Every key of SCRAPERS in packages/scraper/src/operators/index.ts.
        operator: [egl, jetour, texpert, charming, yummy, bigline, sunflower, taste]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs the pnpm version named in package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm scrape --operator ${{ matrix.operator }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional: verifies the database server. An unset secret is an empty string, which means "not supplied".
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          # The site's address and contact, for the User-Agent. Required: without them the scraper exits 2
          # before any request. GitHub shows their values as *** in the public log.
          SITE_URL: ${{ secrets.SITE_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
