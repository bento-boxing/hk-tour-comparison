name: nightly-scrape

# Each night: apply pending migrations, then scrape every approved operator, each in its own job with its own time
# limit (the matrix below). A job killed by its limit has saved nothing for that operator (saving is one
# transaction at the end), so last night's data stays. A failed job makes GitHub email the owner.
on:
  schedule:
    # Scheduled for 12:17 UTC (20:17 Hong Kong), hours early on purpose: GitHub starts this job hours late (on 20 and
    # 21 November 2026 it started at 04:29 and 03:25 Hong Kong, seven to eight hours late), so it runs in the small
    # hours. Off the hour: GitHub delays or drops jobs scheduled on it.
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-scrape
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs the pnpm version named in package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional: verifies the database server. An unset secret is an empty string, which means "not supplied".
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}

      # Reports only whether the two settings exist (never their values) and cannot fail the job. The scraper
      # takes the site's address and contact (its User-Agent) from them, and refuses to run without them.
      - name: Site identity settings present?
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          echo "SITE_URL set: $([ -n "$SITE_URL" ] && echo yes || echo no)"
          echo "CONTACT_EMAIL set: $([ -n "$CONTACT_EMAIL" ] && echo yes || echo no)"

  scrape:
    name: scrape (${{ matrix.operator }})
    needs: migrate
    runs-on: ubuntu-latest
    # Each operator's limit, in minutes (the matrix below). A crawl keeps its polite pace however long that takes,
    # and one killed by its limit has saved nothing for its operator that night, so each limit sits well above a
    # normal run: Big Line's runs took 142 to 164 minutes (November 2026), the others' at most about 90.
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false # one operator failing must not stop the others
      matrix:
        # Every key of SCRAPERS in packages/scraper/src/operators/index.ts, each with its limit.
        include:
          - { operator: egl, minutes: 170 }
          - { operator: jetour, minutes: 170 }
          - { operator: texpert, minutes: 170 }
          - { operator: charming, minutes: 170 }
          - { operator: yummy, minutes: 170 }
          - { operator: bigline, minutes: 210 }
          - { operator: sunflower, minutes: 170 }
          - { operator: taste, minutes: 170 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs the pnpm version named in package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm scrape --operator ${{ matrix.operator }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional: verifies the database server. An unset secret is an empty string, which means "not supplied".
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          # The site's address and contact, for the User-Agent. Required: without them the scraper exits 2
          # before any request. GitHub shows their values as *** in the public log.
          SITE_URL: ${{ secrets.SITE_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

  # After the crawl, ask once for each stored page: the home page, the destinations index (/tours) and the
  # operators index (/operators), in each language, so their stored copies are made again from tonight's data
  # even when nobody visits them for days. A request that finds a stored copy made more than an hour ago is
  # answered with that copy and has it made again in the background. A copy made less than an hour ago (a visit
  # or a deployment during the last hour made it) is served as it is and not made again: the first request after
  # it turns an hour old does that. The site also reuses its database reads for up to an hour.
  # Plain page requests to the site itself: no secret is sent, only status codes are printed, and a failed
  # request never fails the workflow (each gives up after 60 seconds; nine of them fit inside the limit).
  refresh:
    needs: scrape
    if: ${{ !cancelled() }} # also when one operator's crawl failed: the others' data is new
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Request the stored pages
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          [ -n "$SITE_URL" ] || { echo "SITE_URL not set: skipped"; exit 0; }
          for path in / /zh-hans /en /tours /zh-hans/tours /en/tours /operators /zh-hans/operators /en/operators; do
            code=$(curl -s -o /dev/null -m 60 -w '%{http_code}' "$SITE_URL$path" || true)
            echo "$path $code"
          done
